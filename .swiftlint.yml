# SwiftLint configuration for Presentor
#
# Formatting (indentation, line wrapping, whitespace, braces, commas) is owned
# by SwiftFormat. SwiftLint is reserved for semantic checks only.
# Run locally with: mise run lint

included:
  - Sources
  - Tests
  - Example/PresentorExample
  - Example/PresentorExampleTests

excluded:
  - Example/PresentorExample.xcodeproj
  - .build

# `unused_import` is intentionally omitted: it reports false positives for
# CoreGraphics/Foundation re-exported types (e.g. CGFloat/CGRect), where
# following the suggestion removes a required import.
analyzer_rules:
  - unused_declaration

opt_in_rules:
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - yoda_condition

# Formatting rules are delegated to SwiftFormat; size/complexity limits are
# delegated to code review.
disabled_rules:
  - opening_brace
  - trailing_comma
  - trailing_whitespace
  - trailing_newline
  - trailing_semicolon
  - leading_whitespace
  - vertical_whitespace
  - colon
  - comma
  - control_statement
  - mark
  - return_arrow_whitespace
  - statement_position
  - closure_parameter_position
  - implicit_optional_initialization
  - syntactic_sugar
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count
  - nesting
  - multiple_closures_with_trailing_closure
  - computed_accessors_order
  - static_over_final_class

cyclomatic_complexity:
  warning: 20
  error: 30

identifier_name:
  min_length: 3
  max_length: 50
  excluded:
    - id
    - up
    - x
    - y
    - z
    - by

type_name:
  min_length: 3
  max_length: 60
